# ============================================================
# Server
# ============================================================
server.port=8082
spring.application.name=ai-issue-tracker-mcp

# ============================================================
# Spring AI MCP Server (SSE / WebMVC transport)
# SSE endpoint:     GET  http://localhost:8080/sse
# Message endpoint: POST http://localhost:8080/mcp/messages
# ============================================================
spring.ai.mcp.server.name=ai-issue-tracker
spring.ai.mcp.server.version=1.0.0
spring.ai.mcp.server.type=SYNC
spring.ai.mcp.server.instructions=Issue triage MCP server. Use elk_search to pull logs by traceId and dynatrace_trace to pull distributed trace spans.
spring.ai.mcp.server.sse-message-endpoint=/mcp/messages
spring.ai.mcp.server.capabilities.tool=true
spring.ai.mcp.server.capabilities.resource=false
spring.ai.mcp.server.capabilities.prompt=false

# ============================================================
# ELK (Elasticsearch) — set mock.enabled=false and fill these
# ============================================================
elk.base-url=http://localhost:9200
elk.index=logs-*
elk.api-key=CHANGEME

# ============================================================
# Dynatrace — set mock.enabled=false and fill these
# ============================================================
dynatrace.base-url=https://YOUR_ENV.live.dynatrace.com
dynatrace.api-token=CHANGEME

# ============================================================
# Mock mode
# true  = return realistic fake JSON responses (local dev)
# false = call real ELK and Dynatrace endpoints
# ============================================================
mock.enabled=true
